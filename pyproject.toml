[project]
name = "pcb-viewer"
version = "0.1.0"
description = "Live, read-only browser view of KiCad schematics and board layers while agents edit them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "daponsr" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["kicad", "pcb", "schematic", "viewer", "eda"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Repository = "https://github.com/daponsr/pcb-viewer"

[project.scripts]
pcbwatch = "pcbwatch:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The whole app is one module; ship only that.
only-include = ["pcbwatch.py"]
